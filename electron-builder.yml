appId: com.blockhost.app
productName: Blockhost
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest*.config.mts'
  - '!{.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.superpowers{,/**/*}'
  - '!.claude{,/**/*}'
asarUnpack:
  - resources/**
win:
  executableName: Blockhost
  target: nsis
nsis:
  artifactName: Blockhost-${version}-setup.${ext}
  # The assisted (wizard) installer can show progress details; one-click shows a bare banner.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  shortcutName: Blockhost
  uninstallDisplayName: Blockhost
  createDesktopShortcut: always
npmRebuild: false
publish:
  provider: github
  owner: ToMeXaS
  repo: blockhost
  releaseType: release
